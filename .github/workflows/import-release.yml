name: Import verified Symbol Library release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-release-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extract and verify existing public release
        run: python3 scripts/import_release.py
